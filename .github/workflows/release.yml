name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: node scripts/build.ts
      - name: Name builtin extension archive
        run: mv extension.tar.br "notebook-${GITHUB_REF_NAME}.tar.br"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: notebook-${{ github.ref_name }}.tar.br
          fail_on_unmatched_files: true
